name: Python Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: Run backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: server

    env:
      # Tests use fakes/mocks; these placeholders allow modules to initialize
      # without exposing real provider credentials or contacting external APIs.
      GROQ_API_KEY: ci-placeholder
      GOOGLE_API_KEY: ci-placeholder
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jolumate_test
      RAG_RERANKING_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest -q
